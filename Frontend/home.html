<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main class="narrow">
        <div class="card">
            <h1>Radio RNC</h1>
            <p class="muted">Choose your organization, then sign in as a member or an admin.</p>
            <label>Organization
                <select id="org"></select>
            </label>
            <div class="row">
                <button onclick="goToLogin('user')">Member login</button>
                <button onclick="goToLogin('admin')">Admin login</button>
            </div>
        </div>
    </main>
</body>
</html>
