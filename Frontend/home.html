<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main class="narrow">
        <div class="card">
            <h1>Radio RNC</h1>
            <p class="muted">Choose your organization, then sign in as a member or an admin.</p>
            <label>Organization
                <select id="org"></select>
            </label>
            <div class="row">
                <button onclick="goToLogin('user')">Member login</button>
                <button onclick="goToLogin('admin')">Admin login</button>
            </div>
        </div>
        <div class="card">
            <h2>New organization?</h2>
            <p class="muted">Set up your organization and become its admin.</p>
            <button class="secondary" onclick="location.href='createOrg.html'">Create an organization</button>
        </div>
    </main>

<script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="data-supabase.js"></script>
    <script>
        // Fill the organization dropdown
        async function start() {
        const orgs = await getOrgs();
        document.getElementById('org').innerHTML = orgs.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('');
        }

        // Go to the login page for the chosen organization and role
        function goToLogin(role) {
        const orgId = document.getElementById('org').value;
        location.href = `login.html?org=${encodeURIComponent(orgId)}&role=${role}`;
        }

        start();
    </script>

</body>
</html>
