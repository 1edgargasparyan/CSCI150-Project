<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>
    <main>
        <h1>Admin dashboard</h1>

        <div class="card">
        <h2>Add a person</h2>
        <div class="row">
            <label>Full name <input id="name"></label>
            <label>Google email <input id="email" type="email" placeholder="name@gmail.com"></label>
            <label>Role
            <select id="role">
                <option value="user">Member</option>
                <option value="admin">Admin</option>
            </select>
            </label>
        </div>
        <button onclick="handleAddMember()">Add</button>
        <p id="memberMsg" class="msg"></p>
        </div>

        <div class="card">
        <h2>People</h2>
        <div class="table-wrap">
            <table>
            <thead><tr><th>Name</th><th>Google email</th><th>Role</th><th></th></tr></thead>
            <tbody id="members"></tbody>
            </table>
        </div>
        </div>

        <div class="card">
        <h2>Member portal branding</h2>
        <label>Header title <input id="title"></label>
        <div class="row">
            <label>Brand color <input id="color" type="color"></label>
            <label>Logo image <input id="logo" type="file" accept="image/*" onchange="handleLogoPicked()"></label>
        </div>
        <p class="muted" id="logoText"></p>
        <button onclick="handleSaveBranding()">Save branding</button>
        <button class="secondary" onclick="handleRemoveLogo()">Remove logo</button>
        <p id="brandMsg" class="msg"></p>
        </div>
    </main>

    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="data-supabase.js"></script>
    <script>
        let session;       // { user, org } for the logged-in admin
        let logo = '';     // the logo image (as text) that will be saved

        async function start() {
        session = await requireLogin('admin');
        showHeader(session, 'adminDashboard.html');
        // Put the current branding into the form
        document.getElementById('title').value = session.org.title || '';
        document.getElementById('color').value = session.org.color || '#2563eb';
        logo = session.org.logo || '';
        document.getElementById('logoText').textContent = logo ? 'A logo is set.' : 'No logo yet.';
        await showMembers();
        }

        // Draw the people table (you can't remove yourself)
        async function showMembers() {
        const members = await listUsers(session.org.id);
        document.getElementById('members').innerHTML = members.map(m => `
                <tr>
                <td>${esc(m.name)}${m.id === session.user.id ? ' (you)' : ''}</td>
                <td>${esc(m.email)}</td>
                <td>${m.role === 'admin' ? 'Admin' : 'Member'}</td>
                <td>${m.id === session.user.id ? '' : `<button class="danger small" onclick="handleRemoveMember('${m.id}')">Remove</button>`}</td>
                </tr>`).join('');
        }

        async function handleAddMember() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const role = document.getElementById('role').value;
        try {
            const member = await addUser(session.org.id, name, email, role);
            const loginName = member.role === 'admin' ? 'Admin login' : 'Member login';
            showMessage('memberMsg', `Added. ${member.name} can now use ${loginName} and sign in with Google as ${member.email}.`, false);
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            await showMembers();
        } catch (error) {
            showMessage('memberMsg', error.message, true);
        }
        }

        async function handleRemoveMember(userId) {
        if (!confirm('Remove this person? Their reservations will be cancelled.')) return;
        try {
            await removeUser(userId);
            await showMembers();
        } catch (error) {
            showMessage('memberMsg', error.message, true);
        }
        }

        // Read the chosen image file into text so it can be saved with the branding
        function handleLogoPicked() {
        const file = document.getElementById('logo').files[0];
        if (!file) return;
        if (file.size > 200 * 1024) { showMessage('brandMsg', 'Please pick an image under 200 KB.', true); return; }
        const reader = new FileReader();
        reader.onload = () => {
            logo = reader.result;
            document.getElementById('logoText').textContent = 'New logo chosen. Click Save branding.';
        };
        reader.readAsDataURL(file);
        }

        function handleRemoveLogo() {
        logo = '';
        document.getElementById('logo').value = '';
        document.getElementById('logoText').textContent = 'Logo will be removed when you click Save branding.';
        }

        async function handleSaveBranding() {
        try {
            session.org = await saveBranding(session.org.id, {
            title: document.getElementById('title').value.trim(),
            color: document.getElementById('color').value,
            logo: logo
            });
            showHeader(session, 'adminDashboard.html'); // redraw the header with the new look
            document.getElementById('logoText').textContent = logo ? 'A logo is set.' : 'No logo yet.';
            showMessage('brandMsg', 'Branding saved. Members will see it next time they open a page.', false);
        } catch (error) {
            showMessage('brandMsg', error.message, true);
        }
        }

        start();
    </script>

</body>
</html>
