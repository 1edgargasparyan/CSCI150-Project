<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header></header>
    <main>
        <h1>Make a reservation</h1>

        <div class="card">
        <h2>Rooms and equipment</h2>
        <div class="table-wrap">
            <table>
            <thead><tr><th>Name</th><th>Type</th><th>Hours</th><th>Right now</th><th></th></tr></thead>
            <tbody id="resources"></tbody>
            </table>
        </div>
        </div>

        <div class="card" id="bookingCard">
        <h2>Reserve</h2>
        <div class="row">
            <label>Resource <select id="resource" onchange="showBookedTimes()"></select></label>
            <label>Date <input id="date" type="date" onchange="showBookedTimes()"></label>
        </div>
        <div class="row">
            <label>Start time <input id="start" type="time"></label>
            <label>End time <input id="end" type="time"></label>
        </div>
        <button onclick="handleReserve()">Reserve</button>
        <p id="msg" class="msg"></p>

        <h2 style="margin-top:16px">Already booked that day</h2>
        <ul id="booked" class="muted"></ul>
        </div>
    </main>

    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="data-supabase.js"></script>
    <script>
        let session;
        let resources = [];

        async function start() {
        session = await requireLogin('user');
        showHeader(session, 'userReserve.html');
        document.getElementById('date').value = today();
        document.getElementById('date').min = today();
        await showResources();
        await showBookedTimes();
        }

        // Draw the resources table and fill the Resource dropdown
        async function showResources() {
        resources = await listResources(session.org.id);
        const reservations = await listReservations({ orgId: session.org.id, date: today() });

        document.getElementById('resources').innerHTML = resources.map(r => {
            const status = resourceStatus(r, reservations);
            return `
            <tr>
                <td>${esc(r.name)}</td>
                <td>${r.type === 'room' ? 'Room' : 'Equipment'}</td>
                <td>${formatTime(r.open_time)} – ${formatTime(r.close_time)}</td>
                <td class="${status.cssClass}">${status.text}</td>
                <td>${r.status === 'available' ? `<button class="small" onclick="handleChoose('${r.id}')">Choose</button>` : ''}</td>
            </tr>`;
        }).join('') || '<tr><td colspan="5" class="muted">No resources yet.</td></tr>';

        // Only available resources can be picked in the form
        const select = document.getElementById('resource');
        const chosen = select.value;
        select.innerHTML = resources.filter(r => r.status === 'available')
            .map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
        if (chosen) select.value = chosen;
        }

        // "Choose" button in the table → select that resource in the form
        async function handleChoose(resourceId) {
        document.getElementById('resource').value = resourceId;
        await showBookedTimes();
        document.getElementById('bookingCard').scrollIntoView({ behavior: 'smooth' });
        }

        // List the times already taken for the chosen resource and date
        async function showBookedTimes() {
        const resourceId = document.getElementById('resource').value;
        const date = document.getElementById('date').value;
        const list = document.getElementById('booked');
        if (!resourceId || !date) { list.innerHTML = ''; return; }
        const booked = await listReservations({ orgId: session.org.id, resourceId, date });
        list.innerHTML = booked.length
            ? booked.map(r => `<li>${formatTime(r.start_time)} – ${formatTime(r.end_time)}${r.user_id === session.user.id ? ' (yours)' : ''}</li>`).join('')
            : '<li>Nothing booked yet.</li>';
        }

        async function handleReserve() {
        const resourceId = document.getElementById('resource').value;
        const date = document.getElementById('date').value;
        const start = document.getElementById('start').value;
        const end = document.getElementById('end').value;
        try {
            await reserve(session.org.id, session.user.id, resourceId, date, start, end);
            showMessage('msg', 'Reserved! You can see it on your Home page.', false);
            document.getElementById('start').value = '';
            document.getElementById('end').value = '';
        } catch (error) {
            showMessage('msg', error.message, true);
        }
        await showResources();
        await showBookedTimes();
        }

        start();
    </script>
    
</body>
</html>
