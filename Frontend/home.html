<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/47a5fff70a.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div class="header">
            <p>Choose organization and user type</p>
        </div>

        <div class="card">
            <label class=" field">
                <span>Organization</span><br>
                <select id="orgSelection"></select>
            </label>
        </div>
        <div class="user-select">
            <button class="usertype" type="button" data-role="user">
                <div class="icon">
                    <span class="iconTag">
                        <a href="">
                            <i class="fa-solid fa-users"></i>
                        </a>
                    <span>
                        <span class="iconDes">
                            <h2>Member</h2>
                        </span>
                </div>
                <div class="userDes">
                    <p>See your upcoming reservations and book rooms or equipment.</p>
                </div>
            </button>
            <br>
            <button class="usertype" type="button" data-role="admin">
                <div class="icon">
                    <span class="iconTag">
                        <a href="">
                            <i class="fa-solid fa-user-tie"></i>
                        </a>
                    <span>
                        <span class="iconDes">
                            <h2>Administrator</h2>
                        </span>
                </div>
                <div class="userDes">
                    <p>Create member accounts, manage resources and customize your portal.</p>
                </div>
            </button>
            <br>
            <button class="usertype" type="button" data-role="admin">
                <div class="icon">
                    <span class="iconTag">
                        <a href="">
                            <i class="fa-regular fa-building"></i>
                        </a>
                    <span>
                        <span class="iconDes">
                            <h2>Add Organization</h2>
                        </span>
                </div>
                <div class="userDes">
                    <p>Create member accounts, manage resources and customize your portal.</p>
                </div>
            </button>
        </div>




    </main>
    
</body>
</html>
