<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="narrow">
        <div class="card">
        <div id="logo"></div>
        <h1 id="orgTitle">Sign in</h1>
        <p class="muted" id="roleText"></p>
        <button onclick="handleGoogle()">Sign in with Google</button>
        <p id="msg" class="msg"></p>
        </div>
        <a href="home.html">← Back</a>
    </main>

    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="data-supabase.js"></script>
    <script>
        // The organization and role come from the link on the start page: login.html?org=...&role=...
        const params = new URLSearchParams(location.search);
        const orgId = params.get('org');
        const role = params.get('role') === 'admin' ? 'admin' : 'user';

        // Show the organization's name, logo and color
        async function start() {
        const org = await getOrg(orgId);
        if (!org) { location.href = 'home.html'; return; }
        applyBranding(org);
        document.getElementById('orgTitle').textContent = org.title || org.name;
        document.getElementById('roleText').textContent = role === 'admin' ? 'Admin sign in' : 'Member sign in';
        if (org.logo) document.getElementById('logo').innerHTML = `<img src="${esc(org.logo)}" alt="logo" style="max-height:60px">`;

        // Just came back from Google? Check the account, then go to the right dashboard
        try {
            const user = await finishLogin(orgId, role);
            if (user) location.href = role === 'admin' ? 'adminDashboard.html' : 'userDashboard.html';
        } catch (error) {
            showMessage('msg', error.message, true);
        }
        }

        // Send the browser to Google's sign-in page
        async function handleGoogle() {
        try {
            await loginWithGoogle(orgId, role);
        } catch (error) {
            showMessage('msg', error.message, true);
        }
        }

        start();
    </script>


</body>
</html>
