<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <main class="narrow">
        <div class="card">
        <div id="logo"></div>
        <h1 id="orgTitle">Sign in</h1>
        <p class="muted" id="roleText"></p>
        <!-- onsubmit lets the Enter key sign in too -->
        <form onsubmit="handleLogin(); return false;">
            <label>Username <input id="username" autocomplete="username"></label>
            <label>Password <input id="password" type="password" autocomplete="current-password"></label>
            <button type="submit">Sign in</button>
        </form>
        <p id="msg" class="msg"></p>
        </div>
        <a href="index.html">← Back</a>
    </main>

    <script src="ui.js"></script>
    <script src="data.js"></script>
    <script>
        // The organization and role come from the link on the start page: login.html?org=...&role=...
        const params = new URLSearchParams(location.search);
        const orgId = params.get('org');
        const role = params.get('role') === 'admin' ? 'admin' : 'user';

        // Show the organization's name, logo and color
        async function start() {
        const org = await getOrg(orgId);
        if (!org) { location.href = 'index.html'; return; }
        applyBranding(org);
        document.getElementById('orgTitle').textContent = org.title || org.name;
        document.getElementById('roleText').textContent = role === 'admin' ? 'Admin sign in' : 'Member sign in';
        if (org.logo) document.getElementById('logo').innerHTML = `<img src="${esc(org.logo)}" alt="logo" style="max-height:60px">`;
        }

        // Check the login, then go to the right dashboard
        async function handleLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        try {
            await login(orgId, username, password, role);
            location.href = role === 'admin' ? 'admin-dashboard.html' : 'user-dashboard.html';
        } catch (error) {
            showMessage('msg', error.message, true);
        }
        }

        start();
    </script>

</body>
</html>
