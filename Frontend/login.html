<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <main class="loginCard">
        <div class="card">
            <div class="login-brand">
                <div class="app-mark" id="orgMark"></div>
                    <h1 id="orgTitle"></h1>
                <p class="muted" id="roleLine"></p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <label class="field">
                    <span>Username</span>
                    <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </label>
                <label class="field">
                    <span>Password</span>
                    <div class="input-row">
                        <input type="password" id="password" autocomplete="current-password" required>
                        <button class="btn btn-ghost btn-sm" type="button" id="togglePw" aria-label="Show password">Show</button>
                    </div>
                </label>
                <p class="error" id="err" role="alert"></p>
                <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
                <p class="small muted" id="helpText" style="text-align:center;margin:0"></p>
            </form>
        </div>
        <a class="back-link" href="index.html">← Choose a different organization or role</a>

    </main>
    
</body>
</html>
