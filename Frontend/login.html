<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio RNC: Login</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <main class="narrow">
        <div class="card">
        <div id="logo"></div>
        <h1 id="orgTitle">Sign in</h1>
        <p class="muted" id="roleText"></p>
        <!-- onsubmit lets the Enter key sign in too -->
        <form onsubmit="handleLogin(); return false;">
            <label>Username <input id="username" autocomplete="username"></label>
            <label>Password <input id="password" type="password" autocomplete="current-password"></label>
            <button type="submit">Sign in</button>
        </form>
        <p id="msg" class="msg"></p>
        </div>
        <a href="index.html">← Back</a>
    </main>

</body>
</html>
